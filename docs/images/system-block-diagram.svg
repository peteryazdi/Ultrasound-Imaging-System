<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="330" rx="10" fill="#ffffff"/>

  <text x="24" y="34" font-size="13" font-weight="600" fill="#57606a" letter-spacing="0.5">TRANSMIT</text>
  <text x="24" y="196" font-size="13" font-weight="600" fill="#57606a" letter-spacing="0.5">RECEIVE</text>

  <!-- Transmit row -->
  <g font-size="14">
    <rect x="24" y="48" width="190" height="74" rx="8" fill="#1f3a5f"/>
    <text x="119" y="80" text-anchor="middle" fill="#ffffff" font-weight="600">Pattern generator</text>
    <text x="119" y="100" text-anchor="middle" fill="#d0d7de" font-size="12">AD2 now, FPGA in Rev 1</text>

    <rect x="262" y="48" width="200" height="74" rx="8" fill="#1f3a5f"/>
    <text x="362" y="80" text-anchor="middle" fill="#ffffff" font-weight="600">HV transmit pulser</text>
    <text x="362" y="100" text-anchor="middle" fill="#d0d7de" font-size="12">MD1213 + TC6320 (Rev 0)</text>

    <rect x="510" y="48" width="170" height="74" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="595" y="80" text-anchor="middle" fill="#24292f" font-weight="600">T/R switch</text>
    <text x="595" y="100" text-anchor="middle" fill="#57606a" font-size="12">protects receive input</text>

    <rect x="728" y="48" width="208" height="74" rx="8" fill="#1f3a5f"/>
    <text x="832" y="80" text-anchor="middle" fill="#ffffff" font-weight="600">Transducer</text>
    <text x="832" y="100" text-anchor="middle" fill="#d0d7de" font-size="12">5 MHz elements, water path</text>
  </g>
  <line x1="214" y1="85" x2="258" y2="85" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="462" y1="85" x2="506" y2="85" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="78" x2="724" y2="78" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="724" y1="94" x2="684" y2="94" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="702" y="112" text-anchor="middle" font-size="11" fill="#57606a">echo</text>

  <!-- Down from T/R switch to receive row -->
  <path d="M595,122 L595,150 L870,150 L870,206" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Receive row (right to left) -->
  <g font-size="14">
    <rect x="790" y="210" width="146" height="74" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="863" y="242" text-anchor="middle" fill="#24292f" font-weight="600">LNA + TGC</text>
    <text x="863" y="262" text-anchor="middle" fill="#57606a" font-size="12">gain rises with depth</text>

    <rect x="610" y="210" width="134" height="74" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="677" y="242" text-anchor="middle" fill="#24292f" font-weight="600">Band-pass</text>
    <text x="677" y="262" text-anchor="middle" fill="#57606a" font-size="12">filter</text>

    <rect x="460" y="210" width="104" height="74" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="512" y="252" text-anchor="middle" fill="#24292f" font-weight="600">ADC</text>

    <rect x="226" y="210" width="188" height="74" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="320" y="242" text-anchor="middle" fill="#24292f" font-weight="600">FPGA</text>
    <text x="320" y="262" text-anchor="middle" fill="#57606a" font-size="12">delay-and-sum beamforming</text>

    <rect x="24" y="210" width="156" height="74" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="102" y="242" text-anchor="middle" fill="#24292f" font-weight="600">Image</text>
    <text x="102" y="262" text-anchor="middle" fill="#57606a" font-size="12">A-scan, B-scan</text>
  </g>
  <line x1="790" y1="247" x2="748" y2="247" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="610" y1="247" x2="568" y2="247" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="247" x2="418" y2="247" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="226" y1="247" x2="184" y2="247" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="24" y="302" width="18" height="12" rx="3" fill="#1f3a5f"/>
  <text x="50" y="312" font-size="12" fill="#57606a">Working on the bench (Rev 0)</text>
  <rect x="262" y="302" width="18" height="12" rx="3" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="288" y="312" font-size="12" fill="#57606a">In development (Rev 1 and later)</text>
</svg>
